<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مسدس الغسيل اللاسلكي Pelifish | متجر Vir Mart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060913;
      --bg-card: #0d1326;
      --bg-card-hover: #131c38;
      --primary: #2563eb;
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.35);
      --danger: #ef4444;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* شريط علوي */
    .top-bar {
      background: linear-gradient(90deg, #1d4ed8, #0284c7);
      text-align: center;
      padding: 9px 15px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* الهيدر */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 6%;
      background: rgba(6, 9, 19, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(90deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .nav-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      padding: 9px 22px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: transform 0.2s;
    }

    .nav-btn:hover {
      transform: scale(1.05);
    }

    /* القسم الرئيسي Hero */
    .hero {
      max-width: 1150px;
      margin: 35px auto;
      padding: 0 5%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 22px;
    }

    .price-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 24px;
      display: inline-flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .current-price {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
    }

    .old-price {
      font-size: 1.15rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .discount-tag {
      background: var(--danger);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .cta-primary {
      display: inline-block;
      width: 100%;
      max-width: 380px;
      text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 15px;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 10px 30px var(--accent-glow);
      transition: 0.25s;
    }

    .cta-primary:hover {
      transform: translateY(-3px);
    }

    /* حاوية الصورة ومعرض الصور */
    .product-visual {
      background: radial-gradient(circle at center, rgba(37, 99, 235, 0.25), var(--bg-card));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
    }

    .main-img-container {
      width: 100%;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
    }

    .main-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.6));
      transition: transform 0.3s ease;
    }

    /* صور مصغرة إضافية */
    .thumbnails {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .thumb {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      border: 2px solid var(--border);
      object-fit: cover;
      cursor: pointer;
      opacity: 0.7;
      transition: 0.2s;
      background: var(--bg-dark);
    }

    .thumb.active, .thumb:hover {
      border-color: var(--accent);
      opacity: 1;
      transform: scale(1.05);
    }

    /* قسم الفيديوهات الإعلانية */
    .ads-section {
      max-width: 1150px;
      margin: 60px auto;
      padding: 0 5%;
    }

    .ads-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .ad-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.25s;
    }

    .ad-card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(0, 210, 255, 0.12);
    }

    .ad-label {
      display: inline-block;
      color: var(--accent);
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .post-box {
      background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.2), rgba(6, 9, 19, 0.9));
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .post-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .post-box h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .post-box p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .yt-post-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 11px 22px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
      transition: transform 0.2s;
    }

    .yt-post-btn:hover {
      transform: translateY(-2px);
    }

    /* المميزات */
    .features {
      max-width: 1150px;
      margin: 60px auto;
      padding: 0 5%;
    }

    .section-title {
      font-size: 1.9rem;
      font-weight: 900;
      margin-bottom: 10px;
      text-align: center;
    }

    .section-title span {
      color: var(--accent);
    }

    .section-subtitle {
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      transition: 0.25s;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .card h3 {
      font-size: 1.15rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* قسم الطلب الاحترافي */
    .order-section {
      max-width: 680px;
      margin: 60px auto;
      padding: 0 5%;
    }

    .order-card {
      background: var(--bg-card);
      border: 2px solid var(--primary);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 0 40px rgba(37, 99, 235, 0.22);
    }

    /* بطاقة المنتج المصغرة داخل نموذج الطلب */
    .order-product-preview {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 22px;
    }

    .order-product-preview img {
      width: 75px;
      height: 75px;
      border-radius: 12px;
      object-fit: cover;
      background: #fff;
    }

    .order-product-info h4 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }

    .order-product-info span {
      color: var(--accent);
      font-weight: 900;
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #060913;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--accent);
    }
