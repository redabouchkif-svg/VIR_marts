<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vir Mart | متجرك الشامل لكل ما تحتاجه</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #05070f;
      --card-bg: rgba(15, 23, 42, 0.8);
      --primary-cyan: #00f7ff;
      --primary-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-border: rgba(0, 247, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    html {
      scroll-behavior: smooth; /* تمرير سلس عند الضغط على الروابط */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* تأثير إضاءة احترافي في الخلفية */
    body::before {
      content: '';
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 70vw;
      height: 70vh;
      background: radial-gradient(circle, rgba(0, 247, 255, 0.08), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    .promo-bar {
      background: linear-gradient(90deg, var(--primary-purple), var(--primary-cyan));
      color: #000;
      font-weight: 900;
      text-align: center;
      padding: 8px 0;
      font-size: 0.95rem;
      overflow: hidden;
      white-space: nowrap;
    }
    
    .promo-bar p {
      display: inline-block;
      animation: scrollPromo 20s linear infinite;
    }
    @keyframes scrollPromo {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      padding: 20px 5%;
      background: rgba(5, 7, 15, 0.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(to right, #fff, var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0, 247, 255, 0.3);
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: var(--text-main);
      text-decoration: none;
      margin-right: 20px;
      font-weight: 700;
      transition: color 0.3s;
    }
    nav a:hover {
      color: var(--primary-cyan);
    }

    .hero {
      position: relative;
      padding: 80px 20px;
      text-align: center;
      background: linear-gradient(135deg, rgba(15,23,42,0.6), rgba(5,7,15,0.9));
      border-bottom: 1px solid var(--glass-border);
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: 15px;
      color: #fff;
      text-shadow: 0 0 25px var(--primary-cyan);
    }
    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .container {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 50px;
      font-weight: 900;
    }
    .section-title span {
      color: var(--primary-cyan);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-12px);
      border-color: var(--primary-cyan);
      box-shadow: 0 15px 35px rgba(0, 247, 255, 0.25);
    }

    .badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: linear-gradient(45deg, #ff0055, #ff5588);
      color: #fff;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 10;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    /* تحسين عرض لقطات الشاشة والصور */
    .card-img-wrapper {
      overflow: hidden;
      height: 260px;
      background: #ffffff; 
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--glass-border);
    }
    
    .card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.5s ease;
      border-radius: 10px;
    }
    .card:hover img >
